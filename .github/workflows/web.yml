name: Check Campus Guide website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/01-campus-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/01-campus-desk/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: demos/01-campus-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # OpenCV (used by RapidOCR) loads libGL at import time.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ../.. -r backend/requirements.txt
      - run: .venv/bin/python -m pytest backend/tests -q
